# Nginx configuration for Rock Paper Scissors app
# This should be placed in your server block

location /scissors {
    # Remove trailing slash and add it back to normalize
    rewrite ^/scissors$ /scissors/ permanent;

    # Proxy to Gunicorn socket
    proxy_pass http://unix:/var/www/scissors/scissors.sock;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CRITICAL: Tell Flask about the subpath
    proxy_set_header X-Forwarded-Prefix /scissors;

    # Increase timeouts for long-polling/real-time features
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# Static files (optional optimization)
location /scissors/static {
    alias /var/www/scissors/app/static;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
