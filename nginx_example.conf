# Nginx configuration for the Rock Paper Scissors app.
# This mirrors the block actually in use at lab.kudithipudi.org's server
# config (shared nginx config, not managed from this repo). Nginx strips
# the /scissors prefix before proxying, so the app itself sees plain paths
# (e.g. "/", "/static/..."); see app/templating.py for how outgoing links
# get the prefix put back for the browser.

location /scissors/ {
    include proxy_params;
    proxy_set_header X-Script-Name /scissors;
    proxy_set_header X-Forwarded-Prefix /scissors;

    # Strip /scissors prefix before passing to the app
    rewrite ^/scissors(/.*)$ $1 break;

    proxy_pass http://unix:/var/www/scissors/scissors.sock;
}
