{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <div class="card-header">
        <h1 style="margin-bottom: 0;">Admin Login</h1>
    </div>
    <div class="card-body">
        {% if error %}
        <div style="background: var(--color-danger); color: white; padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg);">
            Wrong password. Please try again.
        </div>
        {% endif %}
        <form method="post" action="{{ url_for('admin_login_submit') }}">
            <div class="form-group" style="margin-bottom: var(--spacing-lg);">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-input" required autofocus placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
