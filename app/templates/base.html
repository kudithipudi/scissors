<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Rock Paper Scissors with friends - Real-time multiplayer with phone shake detection">
    <link rel="icon" href="/favicon.ico">
    <title>{% block title %}Rock Paper Scissors{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="container">
                <a href="{{ url_for('index') }}" class="logo">
                    <span class="logo-icon">✊✋✌️</span>
                    <span class="logo-text">Rock Paper Scissors</span>
                </a>
                <div class="header-right">
                    {% block header_actions %}{% endblock %}
                    <a href="https://lab.kudithipudi.org" class="lab-link">&larr; lab.kudithipudi.org</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container">
                <p>Built with ❤️ in Texas, USA • Copyright Vinay Kudithipudi</p>
                <p>Part of the <a href="https://lab.kudithipudi.org/">Kudithipudi AI Lab</a></p>
            </div>
        </footer>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Base JavaScript -->
    <script>
        // Toast notification system
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-show');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('toast-show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Error handler
        function handleError(message) {
            showToast(message, 'error');
            console.error(message);
        }

        // Success handler
        function handleSuccess(message) {
            showToast(message, 'success');
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
